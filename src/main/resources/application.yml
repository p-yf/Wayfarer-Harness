server:
  port: 8080

spring:
  web:
    resources:
      cache:
        cachecontrol:
          # 本地工具，前端改动后刷新即可生效，避免浏览器缓存旧脚本
          no-cache: true

wayfarer:
  model:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    name: deepseek-flash
  session:
    root: ./sessions
    compact-threshold: 0
  # 卸载消息目录：每个会话一个 jsonl，文件名为会话 id，内容为 {uuid, content}
  unload:
    root: ./unloadedmessage
  # 系统提示词目录：文件名为 agent名称-提示词名称-顺序.md
  prompt:
    root: ./systemprompt
  # 模型配置目录：每个 jsonl 文件一份配置，文件名即配置名称
  model-config:
    root: ./modelconfig
  # 记忆压缩配置目录：每个 jsonl 文件一份配置，文件名即配置名称
  memory-compact-config:
    root: ./memorycompactconfig
  agent:
    name: wayfarer
    max-turns:
  # 人工确认：等待工具确认的最长秒数，超时按未批准处理
  hitl:
    timeout-seconds: 300
