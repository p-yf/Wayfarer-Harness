server:
  port: 8080

spring:
  web:
    resources:
      cache:
        cachecontrol:
          # 本地工具，前端改动后刷新即可生效，避免浏览器缓存旧脚本
          no-cache: true

wayfarer:
  model:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    name: deepseek-flash
  session:
    root: ./.wayfarer/sessions
    compact-threshold: 0
  # 系统提示词目录：文件名为 agent名称-提示词名称-顺序.md
  prompt:
    root: ./.wayfarer/systemprompt
  # 根工作区：其下 skills 目录存放技能文件，编码工具对它的权限与工作区一致
  root-workspace: ./.wayfarer/root-workspace
  # 模型配置目录：每个 jsonl 文件一份配置，文件名即配置名称
  model-config:
    root: ./.wayfarer/modelconfig
  # 记忆压缩配置目录：每个 jsonl 文件一份配置，文件名即配置名称
  memory-compact-config:
    root: ./.wayfarer/memorycompactconfig
  agent:
    # 默认 agent；wayfarerpro 在 wayfarer 全部工具之外额外提供子 Agent 派发与取结果
    name: wayfarer
    max-turns:
  # 子 Agent：单会话最多同时运行 3 个，单任务超时 600s，派生深度最多 2 层
  subagent:
    max-children: 3
    task-timeout-seconds: 600
    max-depth: 2
    finish-wait-seconds: 10
  # 人工确认：等待工具确认的最长秒数，超时按未批准处理
  hitl:
    timeout-seconds: 300
  # 文件变更记录：影子 git 仓库按工作区建立，git-dir 放在工作区之外，不会生成 .git
  changes:
    enabled: true
    root: ./.wayfarer/shadow
    # 这些目录/文件不参与变更记录，写进影子仓库的 info/exclude，不修改工作区自己的 .gitignore
    exclude:
      - .git
      - .wayfarer
      - target
      - node_modules
